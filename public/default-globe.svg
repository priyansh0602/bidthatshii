<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="grid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#334155" stroke-width="3"/>
  <!-- Globe Outer Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#grid)" stroke-width="3"/>
  <!-- Latitude Ellipses -->
  <ellipse cx="64" cy="64" rx="44" ry="18" fill="none" stroke="url(#grid)" stroke-width="2.5" stroke-dasharray="2 1" opacity="0.85"/>
  <!-- Longitude Ellipses -->
  <ellipse cx="64" cy="64" rx="20" ry="44" fill="none" stroke="url(#grid)" stroke-width="2.5" opacity="0.85"/>
  <!-- Equator Line -->
  <line x1="20" y1="64" x2="108" y2="64" stroke="url(#grid)" stroke-width="2" opacity="0.75"/>
  <!-- Meridian Line -->
  <line x1="64" y1="20" x2="64" y2="108" stroke="url(#grid)" stroke-width="2" opacity="0.75"/>
</svg>
